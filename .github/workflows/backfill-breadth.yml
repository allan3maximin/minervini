name: Backfill breadth history

# breadth.json history の task3 詳細指標(market_score/up_down_ratio_25/
# growth_rel_20d/nh_nl_cumulative/index_trends 等)を過去日について再計算し、
# ダッシュボードの「データ蓄積中」を埋めるための単発ワークフロー。
#
# なぜ手動(workflow_dispatch)のみか:
#   - 日次パイプライン(daily.yml)は当日エントリをappendするだけで、指標追加より
#     前の古いエントリは永久にnullのまま残る。それを埋めるのがこのbackfill。
#   - backfillは data/prices/*.parquet 全銘柄(≈1000)に compute_all をかけ直すため
#     数分かかる。冪等(計算済みエントリはスキップ、差分ゼロなら書き込まない)なので
#     一度回せば以降は基本no-op。日次に常設せず必要な時だけ手動起動する。
#
# 実行方法: GitHub → Actions → "Backfill breadth history" → Run workflow。
# まず dry_run=true で更新件数を確認し、問題なければ dry_run=false で本実行する。

on:
  workflow_dispatch:
    inputs:
      dry_run:
        description: "計算のみ行い breadth.json に書き込まない(件数確認用)"
        type: boolean
        default: false

# 日次パイプラインと同じ breadth.json / push 先を触るため、daily と直列化して
# 競合を避ける(同じconcurrency group)。
concurrency:
  group: minervini-daily
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  backfill:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run breadth backfill
        env:
          # docs/data/breadth.json の暗号化鍵。これが無いと復号できず失敗するため必須。
          DASHBOARD_DATA_KEY: ${{ secrets.DASHBOARD_DATA_KEY }}
        run: |
          if [ "${{ inputs.dry_run }}" = "true" ]; then
            python scripts/backfill_breadth_history.py --dry-run
          else
            python scripts/backfill_breadth_history.py
          fi

      - name: Commit results
        id: commit
        if: inputs.dry_run != true
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add docs/data/breadth.json
          if git diff --cached --quiet; then
            echo "No changes to commit."
            echo "has_changes=false" >> "$GITHUB_OUTPUT"
          else
            git commit -m "chore: backfill breadth history detail metrics $(date -u +%Y-%m-%d)"
            echo "has_changes=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Pull latest and push
        if: steps.commit.outputs.has_changes == 'true'
        run: |
          git pull --rebase -X theirs origin ${{ github.ref_name }}
          git push origin HEAD:${{ github.ref_name }}
