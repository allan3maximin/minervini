name: Monthly universe rebuild

on:
  schedule:
    - cron: "0 22 * * 6" # every Saturday 22:00 UTC; filtered to the 1st Saturday below
  workflow_dispatch:

concurrency:
  group: minervini-universe
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  rebuild:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4

      - name: Only run on the first Saturday of the month
        id: check
        run: |
          day=$(date -u +%d)
          if [ "$day" -le 7 ] || [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "run=true" >> "$GITHUB_OUTPUT"
          else
            echo "run=false" >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/setup-python@v5
        if: steps.check.outputs.run == 'true'
        with:
          python-version: "3.11"

      - name: Install dependencies
        if: steps.check.outputs.run == 'true'
        run: pip install -r requirements.txt

      - name: Restore generated site data
        if: steps.check.outputs.run == 'true'
        uses: ./.github/actions/restore-site-data

      - name: Restore price cache
        if: steps.check.outputs.run == 'true'
        uses: ./.github/actions/restore-price-cache

      - name: Rebuild universe and run pipeline
        if: steps.check.outputs.run == 'true'
        env:
          JQUANTS_API_KEY: ${{ secrets.JQUANTS_API_KEY }}
        run: python -m src.pipeline --universe-rebuild

      - name: Commit results
        id: commit
        if: steps.check.outputs.run == 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          # docs/ は gh-pages へ直接 publish するので master には積まない。
          git add data/
          if git diff --cached --quiet; then
            echo "No changes to commit."
            echo "has_changes=false" >> "$GITHUB_OUTPUT"
          else
            git commit -m "chore: monthly universe rebuild $(date -u +%Y-%m-%d)"
            echo "has_changes=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Pull latest and push
        if: steps.check.outputs.run == 'true' && steps.commit.outputs.has_changes == 'true'
        run: |
          git pull --rebase origin ${{ github.ref_name }}
          git push origin HEAD:${{ github.ref_name }}

      - name: Publish site
        if: steps.check.outputs.run == 'true'
        uses: ./.github/actions/publish-site
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          message: "deploy: monthly universe rebuild ${{ github.run_id }}"

      # 月次リビルドはユニバースの顔ぶれが入れ替わる = 新規採用銘柄の履歴が
      # ここで初めてキャッシュに入る。必ず公開しておかないと翌日の日次が取り直す。
      - name: Publish price cache
        if: steps.check.outputs.run == 'true'
        uses: ./.github/actions/publish-price-cache
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          message: "cache: monthly universe rebuild ${{ github.run_id }}"
