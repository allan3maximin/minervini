name: J-Quants fundamentals backfill

# 手動実行専用。ユニバース銘柄の決算履歴をJ-Quantsから取得して
# data/fundamentals_auto.json を構築する(1銘柄1リクエスト・約1.1秒)。
# scope入力で「未取得銘柄だけ」と「全銘柄」を選べる。
on:
  workflow_dispatch:
    inputs:
      scope:
        description: "取得範囲。missing=ストアに決算データが無い銘柄だけ(約580銘柄・11分前後。ユニバース追加分のオンボードはこれで足りる) / all=全ユニバース銘柄(約1580銘柄・29分前後。既存データも取り直す)"
        type: choice
        required: false
        default: missing
        options:
          - missing
          - all

concurrency:
  group: minervini-jquants-backfill
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  backfill:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run backfill
        env:
          JQUANTS_API_KEY: ${{ secrets.JQUANTS_API_KEY }}
          SCOPE: ${{ inputs.scope }}
        run: |
          if [ "${SCOPE:-missing}" = "all" ]; then
            python -m src.data.jquants --backfill
          else
            python -m src.data.jquants --backfill --missing-only
          fi

      - name: Commit results
        id: commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/fundamentals_auto.json data/jquants_state.json
          if git diff --cached --quiet; then
            echo "No changes to commit."
            echo "has_changes=false" >> "$GITHUB_OUTPUT"
          else
            git commit -m "chore: J-Quants fundamentals backfill $(date -u +%Y-%m-%d)"
            echo "has_changes=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Pull latest and push
        if: steps.commit.outputs.has_changes == 'true'
        run: |
          git pull --rebase origin ${{ github.ref_name }}
          git push origin HEAD:${{ github.ref_name }}
