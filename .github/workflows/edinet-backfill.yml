name: EDINET fundamentals backfill

# 手動実行専用。過去N日分の提出書類を遡ってファンダを取得する。
# 初回は days=730 程度を推奨 (2024年4月以前の四半期報告書を拾うため)。
on:
  workflow_dispatch:
    inputs:
      days:
        description: "遡って取得する日数"
        required: true
        default: "730"

concurrency:
  group: minervini-edinet-backfill
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  backfill:
    runs-on: ubuntu-latest
    timeout-minutes: 300
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run backfill
        env:
          EDINET_API_KEY: ${{ secrets.EDINET_API_KEY }}
        run: python -m src.data.edinet --backfill-days "${{ github.event.inputs.days }}"

      - name: Commit results
        id: commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/
          if git diff --cached --quiet; then
            echo "No changes to commit."
            echo "has_changes=false" >> "$GITHUB_OUTPUT"
          else
            git commit -m "chore: EDINET fundamentals backfill $(date -u +%Y-%m-%d)"
            echo "has_changes=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Pull latest and push
        if: steps.commit.outputs.has_changes == 'true'
        run: |
          git pull --rebase origin ${{ github.ref_name }}
          git push origin HEAD:${{ github.ref_name }}
