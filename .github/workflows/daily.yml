name: Daily screener run

on:
  schedule:
    # GitHub Actionsのcronは高負荷時に数時間遅延したり、まれに完全にドロップされることがある
    # (実測: 2026-07-06分は発火せず、2026-07-07分は07:30予定が10:38に3時間超遅延して発火)。
    # 単発cronだと1回落ちるとその日は手動リカバリ必須になるため、07:00-11:00 UTC(16:00-20:00 JST)の
    # 間で毎時リトライし、下記「当日実行済みチェック」で二重実行を防ぐ構成に変更(2026-07-08)。
    - cron: "0 7-11 * * 1-5"
  workflow_dispatch:
    inputs:
      force:
        description: "当日実行済みでも強制再実行 (コード変更を即日反映したい時用)"
        type: boolean
        default: false

concurrency:
  group: minervini-daily
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # 直後の「当日実行済みチェック」がgit logで当日分のコミットを探すため必要

      - name: Check if already run today
        id: check
        run: |
          # 当日分の "chore: daily screener run YYYY-MM-DD" コミットが既にあればスキップ
          # (hourly cronの二重実行防止。2026-07-16にガード復旧 — 2026-07-08から
          # skip=false固定で無効化されたまま放置され、平日最大5回フル実行されていた)
          # 手動実行で force=true が指定された場合はガードを迂回する
          # (当日run後にコードを変えて即日反映したいケース。2026-07-17追加)。
          if [ "${{ inputs.force }}" = "true" ]; then
            echo "skip=false" >> "$GITHUB_OUTPUT"
            echo "Force run requested; bypassing same-day guard."
            exit 0
          fi
          today="$(date -u +%Y-%m-%d)"
          if git log --format=%s -20 | grep -qF "chore: daily screener run ${today}"; then
            echo "skip=true" >> "$GITHUB_OUTPUT"
            echo "Already ran today (${today}); skipping."
          else
            echo "skip=false" >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/setup-python@v5
        if: steps.check.outputs.skip != 'true'
        with:
          python-version: "3.11"

      - name: Install dependencies
        if: steps.check.outputs.skip != 'true'
        run: pip install -r requirements.txt

      - name: Run daily pipeline
        if: steps.check.outputs.skip != 'true'
        env:
          JQUANTS_API_KEY: ${{ secrets.JQUANTS_API_KEY }}
          EDINETDB_API_KEY: ${{ secrets.EDINETDB_API_KEY }}
          # docs/data/*.json の暗号化鍵 (base64 32バイト)。未設定なら平文出力。
          DASHBOARD_DATA_KEY: ${{ secrets.DASHBOARD_DATA_KEY }}
        run: python -m src.pipeline

      - name: Commit results
        id: commit
        if: steps.check.outputs.skip != 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/ docs/
          if git diff --cached --quiet; then
            echo "No changes to commit."
            echo "has_changes=false" >> "$GITHUB_OUTPUT"
          else
            git commit -m "chore: daily screener run $(date -u +%Y-%m-%d)"
            echo "has_changes=true" >> "$GITHUB_OUTPUT"
          fi

      # Committing locally *before* pulling means the working tree is clean
      # here, so `pull --rebase` can cleanly replay our new commit on top of
      # any commit that landed in the meantime (e.g. a manual CSV edit via
      # the dashboard) instead of failing outright on local changes.
      #
      # -X theirs: 2026-07-08、intraday-indices/手動pushとのレース条件で
      # docs/data/*.json (fundamentals_public.json, heatmap.json, indices.json,
      # report.json など、実行のたびに丸ごと再生成されるダッシュボード出力)が
      # 高頻度に競合し、rebaseがconflictでjob全体失敗 → このrunの結果が一切push
      # されずダッシュボードが更新されない事態が発生した。これらのファイルは
      # 手編集される「ソース」ではなく毎回全体再生成される出力なので、行単位
      # マージは無意味 -- コンフリクト時は「今回生成した新しい方(theirs = 直前に
      # ローカルcommitした内容)」を採用してjob失敗を防ぐ。
      # 注意: rebase中の ours/theirs はmergeと逆で、「ours」=rebase先(=origin)、
      # 「theirs」=replayされる自分のコミット、という意味になる。
      - name: Pull latest and push
        if: steps.commit.outputs.has_changes == 'true'
        run: |
          git pull --rebase -X theirs origin ${{ github.ref_name }}
          git push origin HEAD:${{ github.ref_name }}
