name: Maezyou (morning session) screener run

# 前場終了(11:30 JST)タイミングのフルスクリーニング再実行。
# 日次バッチ(daily.yml, 16時以降)とは別枠で、前場の値動きを反映した
# report.json / breadth.json / heatmap 等を生成する。フロントの
# 「前場情報をコピー」ボタンがこのスナップショットを読む前提。
#
# データソース: 価格は yfinance(場中は当日足=前場終了時点の途中足を返す)。
# その途中足は当日夕方の daily.yml が RECHECK_DAYS=30 で上書き再取得するため、
# 引け後には確定値へ自然に更新される(前場スナップショットの副作用は一時的)。
#
# セッションラベル: pipeline は実行時刻(JST)から market_session() で自動判定
# するので、この時間帯の実行は report.json に "market_session": "前場" が入る。
on:
  schedule:
    # GitHub Actions の cron は高負荷時に遅延・ドロップし得るので、前場ウィンドウ
    # (12:30 JST より前 = セッション判定が「前場」のうち)で2回リトライする。
    # 当日実行済みチェックで二重実行は防ぐ。
    - cron: "35 2 * * 1-5"   # JST 11:35 (前場終了直後)
    - cron: "5 3 * * 1-5"    # JST 12:05 (11:35がドロップした時のリトライ)
  workflow_dispatch:
    inputs:
      force:
        description: "当日実行済みでも強制再実行"
        type: boolean
        default: false

concurrency:
  group: minervini-maezyou
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # 「当日実行済みチェック」が git log で当日分コミットを探すため必要

      - name: Check if already run today
        id: check
        run: |
          # 当日分の "chore: maezyou screener run YYYY-MM-DD" コミットが既にあれば
          # スキップ(2回cronの二重実行防止)。force=true で迂回。
          if [ "${{ inputs.force }}" = "true" ]; then
            echo "skip=false" >> "$GITHUB_OUTPUT"
            echo "Force run requested; bypassing same-day guard."
            exit 0
          fi
          today="$(TZ=Asia/Tokyo date +%Y-%m-%d)"
          if git log --format=%s -20 | grep -qF "chore: maezyou screener run ${today}"; then
            echo "skip=true" >> "$GITHUB_OUTPUT"
            echo "Already ran today (${today}); skipping."
          else
            echo "skip=false" >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/setup-python@v5
        if: steps.check.outputs.skip != 'true'
        with:
          python-version: "3.11"

      - name: Install dependencies
        if: steps.check.outputs.skip != 'true'
        run: pip install -r requirements.txt

      - name: Run screener pipeline (morning session)
        if: steps.check.outputs.skip != 'true'
        env:
          JQUANTS_API_KEY: ${{ secrets.JQUANTS_API_KEY }}
          EDINETDB_API_KEY: ${{ secrets.EDINETDB_API_KEY }}
          DASHBOARD_DATA_KEY: ${{ secrets.DASHBOARD_DATA_KEY }}
        run: python -m src.pipeline

      - name: Commit results
        id: commit
        if: steps.check.outputs.skip != 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/ docs/
          if git diff --cached --quiet; then
            echo "No changes to commit."
            echo "has_changes=false" >> "$GITHUB_OUTPUT"
          else
            git commit -m "chore: maezyou screener run $(TZ=Asia/Tokyo date +%Y-%m-%d)"
            echo "has_changes=true" >> "$GITHUB_OUTPUT"
          fi

      # daily.yml と同じレース対策: ローカルcommit後に pull --rebase -X theirs。
      # docs/data/*.json は毎回全体再生成される出力なので、競合時は今回生成分を採用。
      - name: Pull latest and push
        if: steps.commit.outputs.has_changes == 'true'
        run: |
          git pull --rebase -X theirs origin ${{ github.ref_name }}
          git push origin HEAD:${{ github.ref_name }}
