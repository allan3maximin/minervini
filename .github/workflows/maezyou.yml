name: Maezyou (morning session) screener run

# 前場終了(11:30 JST)タイミングのフルスクリーニング再実行(スナップショット方式)。
# 日次バッチ(daily.yml, 16時以降)とは別枠で、前場の値動きを反映した前場断面を
# 生成する。env SCREENER_SNAPSHOT=maezyou を渡すことで pipeline は canonical の
# report.json/breadth.json/positions.json を上書きせず、report_maezyou.json /
# breadth_maezyou.json / positions_maezyou.json / indices_maezyou.json という
# 独立ファイルへ書き出す。さらに status_history / dryup_log / per-stock charts など
# フォワード検証の永続状態も一切触らない。これでフロントの「前場情報をコピー」ボタンが
# 読む前場断面が、EOD の「後場情報をコピー」ボタン用データ(canonical)と混ざらない。
#
# データソース: 価格は yfinance(場中は当日足=前場終了時点の途中足を返す)。
# 価格ストア(data/prices/*)への途中足書き込みは当日夕方の daily.yml が
# RECHECK_DAYS=30 で上書き再取得するため、引け後には確定値へ自然に更新される。
# indices.json は intraday-indices.yml が15分間隔で更新している canonical をそのまま
# 断面として複製する。heatmap は heatmap_maezyou.json へ書き、大引の heatmap.json と
# セクター履歴(data/history/sector.jsonl)には触らない(2026-07-31)。
#
# セッションラベル: pipeline は実行時刻(JST)から market_session() で自動判定
# するので、この時間帯の実行は report_maezyou.json に "market_session": "前場" が入る。
on:
  schedule:
    # GitHub Actions の cron は高負荷時に遅延・ドロップし得るので、前場ウィンドウ
    # (12:30 JST より前 = セッション判定が「前場」のうち)で2回リトライする。
    # 当日実行済みチェックで二重実行は防ぐ。
    - cron: "35 2 * * 1-5"   # JST 11:35 (前場終了直後)
    - cron: "5 3 * * 1-5"    # JST 12:05 (11:35がドロップした時のリトライ)
  workflow_dispatch:
    inputs:
      force:
        description: "当日実行済みでも強制再実行"
        type: boolean
        default: false

concurrency:
  group: minervini-maezyou
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # 「当日実行済みチェック」が git log で当日分コミットを探すため必要

      - name: Check if already run today
        id: check
        run: |
          # 当日分の "chore: maezyou screener run YYYY-MM-DD" コミットが既にあれば
          # スキップ(2回cronの二重実行防止)。force=true で迂回。
          if [ "${{ inputs.force }}" = "true" ]; then
            echo "skip=false" >> "$GITHUB_OUTPUT"
            echo "Force run requested; bypassing same-day guard."
            exit 0
          fi
          today="$(TZ=Asia/Tokyo date +%Y-%m-%d)"
          if git log --format=%s -20 | grep -qF "chore: maezyou screener run ${today}"; then
            echo "skip=true" >> "$GITHUB_OUTPUT"
            echo "Already ran today (${today}); skipping."
          else
            echo "skip=false" >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/setup-python@v5
        if: steps.check.outputs.skip != 'true'
        with:
          python-version: "3.11"

      - name: Install dependencies
        if: steps.check.outputs.skip != 'true'
        run: pip install -r requirements.txt

      # docs/data/** は master ではなく gh-pages にのみ置く構成 (2026-07-27〜)。
      # 前場スナップショットは canonical の breadth.json history をベースに
      # *_maezyou.json を組み立てるため、前回生成物の復元が必須。
      - name: Restore generated site data
        if: steps.check.outputs.skip != 'true'
        uses: ./.github/actions/restore-site-data

      - name: Restore price cache
        if: steps.check.outputs.skip != 'true'
        uses: ./.github/actions/restore-price-cache

      - name: Run screener pipeline (morning session, snapshot)
        if: steps.check.outputs.skip != 'true'
        env:
          JQUANTS_API_KEY: ${{ secrets.JQUANTS_API_KEY }}
          EDINETDB_API_KEY: ${{ secrets.EDINETDB_API_KEY }}
          DASHBOARD_DATA_KEY: ${{ secrets.DASHBOARD_DATA_KEY }}
          # スナップショット方式: canonical を上書きせず docs/data/*_maezyou.json を生成。
          SCREENER_SNAPSHOT: maezyou
        run: python -m src.pipeline

      - name: Commit results
        id: commit
        if: steps.check.outputs.skip != 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          # docs/ は gh-pages へ直接 publish するので master には積まない。
          git add data/
          if git diff --cached --quiet; then
            echo "No changes to commit."
            echo "has_changes=false" >> "$GITHUB_OUTPUT"
          else
            git commit -m "chore: maezyou screener run $(TZ=Asia/Tokyo date +%Y-%m-%d)"
            echo "has_changes=true" >> "$GITHUB_OUTPUT"
          fi

      # daily.yml と同じレース対策: ローカルcommit後に pull --rebase -X theirs。
      # docs/data/*.json は毎回全体再生成される出力なので、競合時は今回生成分を採用。
      - name: Pull latest and push
        if: steps.commit.outputs.has_changes == 'true'
        run: |
          git pull --rebase -X theirs origin ${{ github.ref_name }}
          git push origin HEAD:${{ github.ref_name }}

      - name: Publish site
        if: steps.check.outputs.skip != 'true'
        uses: ./.github/actions/publish-site
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          message: "deploy: maezyou screener run ${{ github.run_id }}"

      # 前場 run のキャッシュには途中足が混じるが、これは master にコミットして
      # いた頃と同じ状態で、夕方の日次 run が RECHECK_DAYS=30 で自己修復する
      # (既存設計)。publish しないと前場ぶんの取得が丸ごと無駄になる。
      - name: Publish price cache
        if: steps.check.outputs.skip != 'true'
        uses: ./.github/actions/publish-price-cache
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          message: "cache: maezyou screener run ${{ github.run_id }}"
