universe:
  # 2026-07-27: 「流動性上位N銘柄」から「20日平均売買代金の下限で切る」方式へ変更。
  # size 固定(1000)だと市況で顔ぶれが入れ替わるだけで拾える裾野が広がらず、かといって
  # 全上場(約3700)まで開けると日商数百万円の板が薄い銘柄が混じる。そういう銘柄は
  # ピボットをブレイクしても成行が滑りストップも板の薄さで機能しないので、
  # 「候補には出るが実際には建てられない」ノイズにしかならない
  # (ミネルヴィニがユニバースに最低流動性を課しているのと同じ理由)。
  # 変更時点の実測: 上位1000位の20日平均売買代金 = 3.57億円、500位 = 16.25億円。
  min_trading_value: 100000000  # 20日平均売買代金(終値×出来高)の下限。1億円
  size: null                    # 上限キャップ。null なら閾値のみで決める(無制限)
  liquidity_window: 20
  jpx_list_url: "https://www.jpx.co.jp/markets/statistics-equities/misc/tvdivq0000001vg2-att/data_j.xls"
  manual_exclude_codes: []  # 監理・整理銘柄等、手動除外コード(JPXの当該リストを別途確認して追記)
  shares_sleep_sec: 0.5  # 発行済株式数の月次取得時スリープ(機能B、ワーカーごと)
  # 2026-07-27: 発行済株式数の取得は yfinance の fast_info を銘柄ごとに1リクエスト
  # 叩くので逐次だと sleep だけで 銘柄数×0.5秒 かかる(閾値方式で約2000銘柄なら17分)。
  # ワーカー間で並列化して現実的な時間に収める。上げすぎると Yahoo に絞られるので
  # 6程度に留める(失敗した銘柄は None のままヒートマップ側が最小面積フォールバック)。
  shares_workers: 6

data:
  history_days: 520
  chunk_size: 50
  sleep_range: [2.0, 4.0]
  # 2026-07-27: 0.10 → 0.15。ユニバースを売買代金1億円の閾値方式に広げたことで、
  # 上場直後・売買不成立日が多いといった「構造的にデータが薄い」銘柄が常時混じる。
  # このガードの本来の目的は「yfinanceが今日丸ごと壊れている」を検知して壊れた
  # レポートの公開を止めることなので、裾野の恒常的な取りこぼしで全体abortさせない。
  # ★初回のフル run 後に実際の失敗率を必ず実測して、この値を締め直すこと。
  max_fail_ratio: 0.15
  stooq_sleep_sec: 2.0
  # stooqフォールバック(1銘柄2秒の逐次)を1 runで試す上限。実行時間の青天井を防ぐ。
  stooq_max_codes: 150
  backoff_sec: [5, 15, 45]
  topix_proxy_ticker: "1306.T"
  # 株式分割・配当落ち検知(2026-07-17): 増分取得とキャッシュの重複期間で終値を
  # 突合し、相対誤差がこの値を超える行があればその銘柄は全履歴を再取得して
  # キャッシュを置き換える(auto_adjust価格は分割で全履歴が変わるため)。
  split_check_tolerance: 0.01

trend_template:
  ma200_up_days_min: 21
  low52w_margin: 1.25
  high52w_margin: 0.75
  rs_min: 70
  # 2026-07-29改定: tech_score は「その日のMUST通過銘柄内での断面パーセンタイルの
  # 等ウェイト平均」になったので、技術面の内訳ウェイト(旧 rs/ma200_days/near_high)は
  # 廃止した。自由パラメータをゼロにするのが設計意図なので、ここに技術3変数の重みを
  # 再導入しないこと(26年検証の根拠は log.md (140))。technical は full_score の中で
  # 技術面が占める配点。
  score_weights: {technical: 55, eps_accel: 25, rev_accel: 10, monthly: 10}

# 機能A: トレンドテンプレート距離ベースのプライオリティ(P1〜P4)
priority:
  # 52週高値からの距離ペナルティ帯 (%)
  high_dist_mid_pct: 25    # これ超〜bad以下: +1
  high_dist_bad_pct: 35    # これ超: +2
  rs_soft_min: 60          # RS<70 かつ RS>=この値: +1 / 未満: +3
  # 地合い警告: 直近実行のP1銘柄数がこの値未満なら弱地合いフラグ
  p1_warn_threshold: 3

# 機能B: セクターヒートマップ
heatmap:
  periods: [1, 5, 20, 60]        # フロント期間切替(営業日)
  strength_window: 20            # セクターRS強弱の判定窓
  direction_window: 5            # 方向(↑/→/↓)の判定窓
  sector_strong_rel_pct: 2.0     # 対TOPIX相対リターンがこれ以上で「強」
  sector_weak_rel_pct: -2.0      # これ以下で「弱」
  direction_up_rel_pct: 0.5
  direction_down_rel_pct: -0.5
  history_keep_days: 400         # data/sector_history.json 保持日数

vcp:
  scan_days: 130
  scan_days_extended: 200
  base_min_days: 15
  base_max_days: 200
  min_days_from_high: 5
  zigzag_min_pct: 0.03
  zigzag_atr_mult: 1.2
  # 2026-07-14: ATR連動閾値の上限。激ボラ銘柄で swing_th が過大になり収縮列が
  # 歪むのを防ぐ(swing_th = min(max(zigzag_min_pct, atr_mult×ATR/close), swing_th_cap))。
  swing_th_cap: 0.08
  # 2026-07-14: ATR/close がこの値を超える銘柄はボラ過大でVCP評価対象外(status=TOO_VOLATILE)。
  # ZigZagがノイズを収縮として拾いすぎ V1/V2/V7 を機械的に落とすため、土俵から外す。
  atr_exclude_threshold: 0.09
  # 2026-07-14: 深さがこの値未満のスイングは独立した収縮とせず隣接波へマージする
  # (削除ではなくマージ。高値・安値の包絡構造を保持しマージ後の深さで再計算)。
  # 過分割による収縮数の水増し(→V1超過・V2非単調・V7切り下げの機械的不合格)を抑える。
  # 2026-07-14時点で不活性(ZigZag確定脚は swing閾値3%以上のため 0.02 では発火しない)。
  # swing_th_cap変更時や閾値見直し時は scripts/diag_vcp_funnel.py で感度を再確認すること。
  min_contraction_depth: 0.02
  # --- 脚の最小期間 (min_contraction_bars / min_rally_bars) ------------------
  #
  # 【原則 (2026-07-26 確定)】**同じ足の中で完結する脚だけを畳む。両方 1 が正解。**
  #
  # ZigZagは自足のレンジだけで閾値を満たした足をH/L両方のピボットにするため、
  # high_idx==low_idx の「0日収縮」と、T(N)の安値とT(N+1)の高値が同じ足に乗る
  # 「0日戻し」が生まれる。どちらも1本のローソクの高安を2つの波に割っているだけの
  # アーティファクトで、footprintのT数・V1/V2/V4/V7・エントリーのピボットを汚染する。
  # これらは merge_short_contractions / merge_short_rallies が包絡保存マージで畳む
  # (merge_short_legs が収束するまで交互に適用)。0 = 無効(従来挙動)。
  #
  # 【なぜ 2 以上にしてはいけないか】
  # 閾値が2以上になった瞬間、「短いが本物の脚」と「アーティファクト」を区別できなくなり、
  # **隣接する本物の収縮を溶接して深さ列を人工的に単調にしてしまう**(=V2を通すために
  # VCPを製造する)。区別できるのは「同足で完結(bars==0)か、足をまたぐ(bars>=1)か」だけ。
  # 値幅条件の併用も効かない: ZigZagは既にswing閾値以上の脚しか出さないので、
  # 0日戻しも値幅は閾値超えであり、値幅では両者を分離できない。
  #
  # 実例 (2026-07-26, 1003銘柄グリッド):
  #   rb 1→2 で増える19銘柄は全て溶接。5232 10/18/5 3T -> 19/5 2T (WATCH_A 96.3 に化ける)、
  #     4390 11/10/10/10/10/7 6T -> 25/10/7 3T、4099 26/17/9 -> 33/9 など。
  #     5232 の畳まれた戻しは idx4 安値5881 -> idx5 高値6434 = **1本で +9.4%** の本物の脚。
  #   cb 1→2 でも同型の溶接。8338 15/11/11/9/6 5T -> 20/14 2T、4021 10/9/6 -> 15/6、
  #     7740 11/9/5/4 -> 15/5/4。逆に 7806/8050/8173 は 1T まで潰されていた。
  #
  # グリッド (cb/rb: WATCH_A / WATCH_B / REJECTED / 0日戻し÷戻し脚):
  #   2/0  2 / 8 / 748 / 1625÷7048     2/1  8 /13 /737 / 0÷5404
  #   2/2 16 /23 / 719 /    0÷4205     1/1  6 /13 /739 / 0÷7200  ← 採用
  #
  # 感度を測り直すときは scripts/diag_contraction_bars.py / diag_rally_bars.py。
  # **1 より大きい値を入れる場合は、必ず footprint の変化を目視して溶接が起きて
  # いないか確認すること**(status分布だけ見ると「WATCHが増えて良くなった」に見える)。
  min_contraction_bars: 1
  min_rally_bars: 1
  contraction_count: [2, 6]
  # 2026-07-12: 1.0(許容ゼロ)→1.2。ZigZag測定ノイズ程度の深さ逆転で落選していたため緩和。
  # バックテスト(400営業日)で緩和により追加されるセットアップの期待R 1.25 と現行合格組(0.82)より
  # 良好なことを確認済み(data/backtest/vcp_tolerance_comparison_20260712.md)。
  # なお swing_low_tolerance(V7)の緩和は同バックテストで質の劣化(期待R 0.33)が確認されたため見送り。
  monotonic_tolerance: 1.2
  # 2026-07-13新規: 上記tolerance超過の深さ逆転でも、ベース前半(low_idx/base_days<0.5)で
  # 1回だけなら無視してよい(後半の逆転・2回目以降の逆転は従来通りV2違反)。
  early_violation_allowance: 1
  # 2026-07-13新規: 段階チェックを迂回しても、最終収縮が初回収縮のこの比率以上に緩ければ
  # 絶対的にV2違反とするバックストップ(全体としての段階的タイト化を担保)。
  overall_contraction_ratio: 0.6
  first_depth_max: 0.35
  # 2026-07-13: 0.10→0.12。V4(MUST)の最終収縮深さ上限。
  last_depth_max: 0.12
  # 2026-07-13新規: タイトネススコアが満点になる深さ(旧ハードコード0.03を設定化・0.05に変更)。
  last_depth_perfect: 0.05
  # 2026-07-13: volume_dryup_ratio(0.80、直近10日"平均")から改称・変更。単発の出来高スパイクに
  # 頑健な"中央値"ベースに変更(V5(a))。
  volume_dryup_median_ratio: 0.85
  # 2026-07-13新規: V5(b)。ベース全体の出来高回帰傾きが負、かつ直近10日中央値がベース前半
  # (先頭50%)の出来高中央値のこの比率以下なら、水準(a)を満たさなくてもV5合格とする。
  volume_trend_ratio: 0.75
  swing_low_tolerance: 0.99  # 変更なし(0.97緩和は見送り。shakeout_bonus検証後に再検討)
  # 2026-07-13新規: V7シェイクアウト(直前安値をswing_low_tolerance許容内でわずかに下抜け後、
  # 直前高値を更新)検出時のvcp_scoreへの加点(フラット、合計は100点でキャップ)。
  shakeout_bonus: 5
  # 2026-07-13新規: V5の(a)(b)両方成立時にvol_trendスコアへ加算するボーナス
  # (コンポーネント自身の0-1比率換算・上限1.0でクリップ)。
  vol_trend_bonus_fraction: 0.15
  score_weights: {tightness: 30, halving: 20, vol_trend: 20, first_depth: 15, duration: 15}
  # 2026-07-15採用(案Y): tightness配点の条件化。直近10日出来高中央値/vol_ma50
  # (dryup_med_10_50, V5(a)同一系列)が dryup.dryup_badge_mild 未満の「枯れ」銘柄にのみ
  # tightness加点を与え、枯れ不足銘柄は加点ゼロにする。足切りではなく加点の条件化。
  # 背景: 交絡調査でタイト単独は無価値〜逆効果。検証で加点コホート期待R 0.73→1.05、
  # 総合スコア上位50%期待R 0.53→0.86(+0.33R)。MUST(V1〜V7)は不変。dryup値が
  # 取れない(None)場合は従来どおり加点(ゲート無効=保守側)。
  tightness_requires_dryup: true

entry:
  breakout_vol_mult: 1.4
  extended_pct: 0.05
  stop_loss_pct: 0.05
  market_guard_pct: -0.015
  extended_cooldown_days: 14
  status_history_days: 90
  # 2026-07-21新規(ゾンビピボット対策): ロック済みピボットの初回ブレイクから
  # この暦日数を超えたら BREAKOUT/BREAKOUT_WEAK/WATCH_A を STALE(追いかけ禁止・
  # 新ベース待ち)へ落とす。7暦日 ≒ 5営業日(ミネルヴィニの「買いはブレイクから
  # 数日以内」に対応)。
  breakout_stale_days: 7
  # 2026-07-21新規: status_history の最終記録からこの暦日数を超える空白があったら
  # ロック済みピボットを破棄(P1落ち等で追跡が途切れた古いピボットの復活防止)。
  pivot_lock_max_gap_days: 7
  # Simplified JPX tick-size table (regular stocks, not the finer TOPIX100
  # increments -- see design doc 5.1 note). Each row is [price_upper_bound, tick].
  tick_table:
    - [1000, 1]
    - [3000, 5]
    - [5000, 10]
    - [10000, 50]
    - [30000, 100]
    - [50000, 500]
    - [100000, 1000]
    - [300000, 5000]
    - [500000, 10000]
    - [1000000, 50000]
    - [3000000, 100000]
    - [5000000, 500000]
    - [10000000, 1000000]
    - [30000000, 5000000]
    - [50000000, 10000000]

fundamentals:
  min_quarters_for_full: 7
  recommended_quarters: 8
  stale_days: 120
  # 〔本命〕昇格に必要なファンダ強度 (Minervini Code 33 準拠)。
  # 直近EPS YoY と 売上YoY の両方がこの閾値以上で初めて confirmed。
  # YoYが計算不能(前年比較対象なし/前年値<=0)な銘柄は強度未確認として pool 止まり。
  confirmed_eps_yoy_min: 25
  confirmed_rev_yoy_min: 20

# J-Quants API (ファンダメンタル自動取得。Freeプランで運用中)
jquants:
  enabled: true
  api_url: "https://api.jquants.com/v2"
  data_delay_days: 85     # Free: 12週間遅延(84日)+1日マージン。Light以上に上げたら0に
  lookback_days: 7        # 増分取得時、state未記録なら過去N日分の開示を拾う
  sleep_sec: 1.1          # 60req/分 → 1.1sで安全マージン
  max_quarters_keep: 12   # 銘柄あたり保持四半期数

# EDINET DB API (決算短信でJ-Quants 12週遅延窓の直近四半期を補完。案A構成)
# 実地確認(DESIGN_EDINETDB.md 1節)完了、2026-07-08 enabled: true へ切替。
edinetdb:
  enabled: true
  api_url: "https://edinetdb.jp/v1"
  requests_per_day: 90      # Free 100/日。手動検証・失敗リトライ用に10残す
  earnings_limit: 8         # /earnings の limit (default 8, max 30)
  codemap_refresh_days: 30  # 証券コード→EDINETコード表の再取得間隔
  max_quarters_keep: 12     # jquants と同じ
  onboard_max_attempts: 3   # ファンダが皆無の銘柄を初回取得のためbacklogへ積み直す上限回数。
                            # 取得できても1件も採用できない銘柄(EDINET DBに決算短信が
                            # 無い等)で毎日 requests_per_day の予算を焼き続けないための上限。

# 枯れ度(DRY-UP)ダッシュボード表示レイヤー。VCP MUST条件(V1〜V7)とも vcp_score とも
# 独立したバッジ/ソート用メトリクス(スコア融合はしない=「スコアは順位付け、フラグは事実」)。
# 判定・表示・ソートは全て dryup_med_10_50(直近10日出来高中央値/vol_ma50)に統一。
# 閾値は 2026-07-15 バックテスト(全992銘柄/400日/日次、値ありセットアップ n=167)の
# 実分布パーセンタイル由来: strong≒p25(0.6598)、mild≒p50(0.7672)を丸めて採用。
# 米株仮置きの固定 0.4/0.6 は東証実分布(中央値0.77)では厳しすぎ、ほぼ点灯しないため置換。
# 四半期ごとに data/dryup_log.jsonl の本番フォワード実測と突合して再検証すること(次回 2026-10)。
dryup:
  dryup_badge_strong: 0.66  # dryup_med_10_50 <= この値で「激枯れ」(濃い方、≒p25)
  dryup_badge_mild: 0.77    # <= この値で「枯れ気味」(≒p50/中央値以下)

scoring:
  phase1_weight: 0.5
  vcp_weight: 0.5

# 地合いシグナル(市場ブレッドス指標 + 攻め/中立/守りの3段階表示)。
# green/yellow/red判定は下2キーのみで決まる(不変ロジック)。detail_weights/
# detail_scale は2026-07-18タスク3で追加した表示専用の market_score(0-100)
# 合成に使う補助設定で、green/yellow/red判定には一切影響しない。
market_signal:
  green_pct_above_ma200: 0.50
  red_pct_above_ma200: 0.30
  # market_score(0-100)のサブスコア配点。
  detail_weights: {breadth: 40, index_trend: 30, momentum: 20, risk_appetite: 10}
  # 各サブスコアの線形クリップ境界(lo→0点 / hi→満点)。
  detail_scale:
    breadth_lo: 0.2
    breadth_hi: 0.6
    up_down_ratio_lo: 0.7
    up_down_ratio_hi: 1.3
    breadth_trend_lo: -0.10
    breadth_trend_hi: 0.10
    growth_rel_lo: -5.0
    growth_rel_hi: 5.0

# 信用残(信用取引週末残高)表示専用レイヤー。dryupと同じ「スコアは順位付け、
# フラグは事実」原則で、総合スコアには一切組み込まない(HANDOFF_TASKS_20260718.txt)。
# JPX無料公表「銘柄別信用取引週末残高」(火曜16:30頃、前週金曜申込分)由来。
margin:
  enabled: true
  page_url: "https://www.jpx.co.jp/markets/statistics-equities/margin/05.html"
  keep_weeks: 26          # 約半年分(週次)を保持。J-Quantsバックフィルした過去分を日次トリムで削らないため
  high_ratio_warn: 5.0    # 信用倍率これ以上で「買い長」注意
  dtc_warn: 3.0           # days_to_cover これ以上で「買残重い」注意
  low_ratio_info: 1.0     # これ以下で「売り長」(踏み上げ余地)表示
